
name: Build RAMBridge APKs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configure JVM 17 for all modules
        run: |
          for file in shared/build.gradle.kts server/build.gradle.kts client/build.gradle.kts; do
            cat >> "$file" <<'EOF'

          // RAMBridge: keep Java and Kotlin JVM targets consistent.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          EOF
          done

      - name: Build both applications
        run: gradle --no-daemon :server:assembleDebug :client:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RAMBridge-debug-APKs
          path: |
            server/build/outputs/apk/debug/server-debug.apk
            client/build/outputs/apk/debug/client-debug.apk
          if-no-files-found: error
          retention-days: 14
          
